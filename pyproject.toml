[project]
name = "weather-rain-prediction"
version = "0.1.0"
description = "ML-проект для прогноза дождя на следующий день по погодным данным Australia Weather"
requires-python = ">=3.11"
authors = [{ name = "Student" }]
dependencies = [
    "kagglehub==0.3.6",
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "matplotlib==3.9.2",
    "joblib==1.4.2",
    "xgboost==2.1.2",
    "lightgbm==4.5.0",
]

[project.optional-dependencies]
dev = [
    "notebook==7.2.2",
    "jupyterlab==4.2.5",
    "ipykernel==6.29.5",
    "ruff==0.7.4",
    "pytest==8.3.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
